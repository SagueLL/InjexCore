# Drift Intelligence v1 policy.
# Validated against src/intelligence/drift/policy.py (StrictModel: unknown
# keys raise). References are computed on the behaviour train window only —
# leakage-safe; nothing is refitted on validation data. The healthy-only
# view is an analytical comparison: upstream models, scores and thresholds
# are never modified, and no sensor is excluded from production scoring.

features:
  source: process_sensor
  include_columns: []
  exclude_columns: []
  min_non_null_fraction: 0.0 # drift must SEE sparse sensors; never pre-drop

profiles:
  min_samples_per_profile: 200
  exclude_profiles: [unknown]
  global_fallback: false

upstream:
  # Behaviour is run-versioned; leave these empty to resolve the latest
  # completed behaviour run, or pin an explicit artifact path here.
  profile_labels_path: ""
  behaviour_manifest_path: ""
  anomaly_root: data/intelligence/anomaly
  anomaly_run: latest # pin to a concrete id for reproducibility at sign-off
  pca_root: data/intelligence/pca
  pca_run: latest
  correlation_root: data/intelligence/correlation
  correlation_run: latest
  sensor_health_root: data/intelligence/sensor_health
  sensor_health_run: latest
  operational_root: data/context/operational
  operational_run: latest

windows:
  granularity: daily # hourly supported but ~24x the distribution-metric work
  min_rows_per_window: 30
  min_valid_fraction: 0.3

univariate:
  enabled_metrics:
    - mean_shift
    - median_shift
    - std_shift
    - iqr_shift
    - zero_rate_shift
    - missingness_shift
    - unique_value_collapse
    - psi
    - ks_statistic
    - wasserstein_distance
  per_profile: true
  psi_bins: 10
  psi_smoothing: 1.0e-4
  max_reference_sample: 5000 # deterministic quantile-spaced KS/W1 reference
  unique_collapse_train_factor: 0.5
  zero_eps: 1.0e-9

multivariate:
  enabled: true
  anomaly_score_columns:
    - statistical_score
    - mahalanobis_score
    - pca_q_score
    - pca_t2_score
    - isolation_forest_score
    - combined_score
  pca_score_columns: [t2, q_spe, reconstruction_error]
  severity_rate: true
  detector_agreement: true

correlation:
  enabled: true
  top_k_pairs: 20
  strong_threshold: 0.7
  weak_threshold: 0.3
  sign_flip_min_abs: 0.3
  material_delta: 0.3
  min_material_pairs_for_event: 3

context:
  enabled: true
  columns:
    - profile
    - steam_context
    - sensor_health_context
    - product_code
    - recipe_context_key
    - bom_context_status
  psi_smoothing: 1.0e-4

healthy_view:
  enabled: true
  exclude_statuses: [faulty, quarantine_recommended]
  evidence_dominance_fraction: 0.6 # Level A event filter
  multivariate_proxy: true # Level B — always labeled healthy_only_proxy

sensor_health_override:
  enabled: true
  strong_issue_families: [flatline_zero, counter_reset, missingness_spike]
  min_overlap_fraction: 0.5
  promote_faulty_events: true # faulty sensor-health events become sensor_drift events

scoring:
  metric_caps:
    mean_shift: 3.0
    median_shift: 3.0
    std_shift: 1.5
    iqr_shift: 1.5
    zero_rate_shift: 0.5
    missingness_shift: 0.5
    unique_value_collapse: 1.0
    psi: 0.5
    ks_statistic: 0.5
    wasserstein_distance: 3.0
    severity_rate_shift: 0.5
    detector_agreement_shift: 2.0
    categorical_psi: 0.5
    total_variation: 0.5
  metric_weights:
    mean_shift: 0.5
    median_shift: 0.5
    std_shift: 0.5
    iqr_shift: 0.5
    zero_rate_shift: 1.0
    missingness_shift: 1.0
    unique_value_collapse: 1.0
    psi: 1.0
    ks_statistic: 1.0
    wasserstein_distance: 1.0
    severity_rate_shift: 1.0
    detector_agreement_shift: 0.5
    categorical_psi: 1.0
    total_variation: 1.0
  persistence_bonus: 0.1
  persistence_min_windows: 3
  severity_thresholds:
    info: 0.0
    warning: 0.4
    anomaly: 0.6
    critical: 0.8

events:
  active_score_threshold: 0.5
  gap_merge_windows: 1
  candidate_max_windows: 1
  persistent_min_windows: 7 # 1 week at daily granularity
  abrupt_onset_max_windows: 2
  progressive_min_onset_windows: 4
  episodic_min_segments: 3
  promoted_event_absorb_coverage: 0.7
