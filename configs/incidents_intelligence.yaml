# Incident Aggregation v1 policy.
# Validated against src/intelligence/incidents/policy.py (StrictModel:
# unknown keys raise). This component consolidates persisted events into
# reviewable incidents — read-only over upstream artifacts; relationships
# are associative (causality_status=unknown); quarantine-class actions are
# recommendations only (approval_required=true, approved=false).

upstream:
  drift_root: data/intelligence/drift
  drift_run: latest # pin to a concrete id for reproducibility at sign-off
  sensor_health_root: data/intelligence/sensor_health
  sensor_health_run: latest
  anomaly_root: data/intelligence/anomaly
  anomaly_run: latest
  operational_root: data/context/operational
  operational_run: latest
  bom_root: data/context/bom
  bom_run: latest

bursts:
  enabled: true
  bucket_freq: 15min
  rate_threshold: 0.5
  min_duration_minutes: 60
  gap_merge_buckets: 1

grouping:
  sensor_health_max_gap_minutes: 240
  drift_max_gap_minutes: 1440 # one daily window
  burst_max_gap_minutes: 60
  context_max_gap_minutes: 240
  affected_jaccard: 0.5
  recurring_collapse_min: 10 # (type, family) groups beyond this collapse to ONE incident
  recurring_collapse_types: [sensor_warning, context_shift, data_quality_issue]
  cross_source_overlap_fraction: 0.7 # same sensor episode seen by two sources = one incident
  context_transition_types: [steam_context_change, sensor_health_change]

suppression:
  enabled: true
  coverage_fraction: 0.7
  require_shared_sensors: true

relationships:
  adjacency_minutes: 360
  follows_max_minutes: 1440
  min_confidence: 0.2

actions:
  by_type:
    sensor_fault: [inspect_sensor_channel]
    sensor_warning: [inspect_sensor_channel]
    data_quality_issue: [review_historian_mapping]
    process_drift: [review_maintenance_log, review_setpoint_changes, compare_healthy_only_drift]
    context_shift: [review_setpoint_changes, review_operator_notes]
    anomaly_burst: [review_maintenance_log]
    correlation_break: [compare_healthy_only_drift]
    multivariate_shift: [compare_healthy_only_drift, inspect_product_recipe_context]
    unknown: [review_operator_notes]
  quarantine_for_persistent_critical_sensor_fault: true
  counter_reset_action: inspect_counter_reset

review_pack:
  max_rows: 200
  dedup_overlap_fraction: 0.8

forensic_addendum:
  enabled: true
  output_root: data/intelligence/forensics/drift_addenda
  top_events: 15
